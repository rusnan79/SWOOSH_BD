<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050E22">
  <title>Swoosh Premium — Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,600;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
  
  <style>
    :root {
      --bg:    #050E22;
      --card:  #0A1830;
      --blue:  #2255CC;
      --blue2: #3B7FFF;
      --sv:    #8AAAC8;
      --sv3:   #D4E6F4;
      --white: #F0F6FF;
      --txt:   #E2EEFF;
      --muted: #6888A8;
      --b1:    rgba(168,204,223,0.14);
      --b2:    rgba(168,204,223,0.26);
      --sg:    linear-gradient(110deg,#6888A8,#B0CCDF,#E8F4FF,#B0CCDF,#6888A8);
      --wa:    #2cba75;
      --r:     14px;
      --t1: 0.15s;
      --t2: 0.25s;
      --sp: cubic-bezier(0.34,1.45,0.64,1);
      --eo: cubic-bezier(0,0,0.2,1);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 75% 55% at 0% 0%,   rgba(34,85,204,.28) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 100% 0%,  rgba(176,204,223,.07) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 110%, rgba(26,58,138,.18)   0%, transparent 55%);
      background-attachment: fixed;
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #prog {
      position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 9999;
      background: linear-gradient(90deg, var(--blue), var(--blue2), var(--sv3));
      transform: scaleX(0); transform-origin: left;
    }

    header {
      position: sticky; top: 0; z-index: 200;
      background: #050E22;
      border-bottom: 1px solid var(--b1);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      min-height: 60px;
    }

    .back-btn {
      background: transparent; border: none; color: var(--txt);
      font-size: 24px; cursor: pointer; padding: 8px;
      min-height: 48px; min-width: 48px; display: flex;
      align-items: center; justify-content: center;
      transition: transform var(--t1);
    }

    .back-btn:active { transform: scale(0.95); }

    header h1 {
      flex: 1; font-family: 'Cormorant', serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem); font-style: italic;
      font-weight: 600; background: var(--sg); background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin: 0;
    }

    .search-bar {
      position: sticky; top: 60px; z-index: 199;
      background: #050E22; border-bottom: 1px solid var(--b1);
      padding: 10px 16px;
    }

    .s-wrap { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
    .s-ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; opacity: 0.28; pointer-events: none; }

    #searchInput {
      width: 100%; padding: 11px 16px 11px 42px; border-radius: 999px;
      border: 1px solid var(--b1); background: rgba(255,255,255,.045);
      font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--white);
      outline: none; transition: border-color var(--t1);
    }

    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus { border-color: var(--blue2); box-shadow: 0 0 0 2px rgba(59,127,255,.14); }

    main { max-width: 1480px; margin: 0 auto; padding: 0 16px 110px; position: relative; z-index: 2; }

    .s-head { display: flex; align-items: center; gap: 14px; margin: 32px 0 20px;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.5s var(--eo), transform 0.5s var(--eo); }
    .s-head.vis { opacity: 1; transform: none; }
    .s-head h2 { font-family: 'Cormorant', serif; font-style: italic; font-weight: 600;
      font-size: clamp(1.4rem, 3.5vw, 2.1rem); color: var(--txt); white-space: nowrap; }
    .s-div { flex: 1; height: 1px; background: linear-gradient(90deg, var(--b2), transparent); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 2vw, 20px); }
    @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      background: var(--card); border-radius: var(--r); border: 1px solid var(--b1);
      overflow: hidden; display: flex; flex-direction: column;
      opacity: 0; transform: translateY(20px);
      transition: opacity .5s var(--eo), transform .5s var(--eo);
    }
    .card.vis { opacity: 1; transform: none; }

    .c-img { position: relative; aspect-ratio: 1/1; overflow: hidden; cursor: pointer; background: #0D1E3C; }
    .main-img { width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform var(--t2); }
    .c-img:hover .main-img { transform: scale(1.07); }

    .c-body { padding: 10px 13px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .c-top { display: flex; justify-content: space-between; align-items: center; gap: 7px; }
    .c-name { font-family: 'Cormorant', serif; font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.1rem); font-weight: 600; color: var(--txt);
      line-height: 1.2; flex: 1; }
    .c-price { font-size: 10.5px; font-weight: 600;
      letter-spacing: .04em; white-space: nowrap; padding: 4px 10px; border-radius: 999px;
      background: var(--sg); background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      border: 1px solid var(--b1); }

    .wa {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      background: linear-gradient(135deg, #2ed573, var(--wa), #1aaa54);
      color: #fff; text-decoration: none; border-radius: 9px;
      padding: 11px 14px; min-height: 44px; font-family: 'Outfit', sans-serif;
      font-weight: 600; font-size: clamp(11.5px, 1.5vw, 13px);
      letter-spacing: .06em; transition: transform var(--t1) var(--sp);
      box-shadow: 0 3px 14px rgba(37,211,102,.2);
      border: none;
      cursor: pointer;
    }

    .wa:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,.42); }
    .wa:active { transform: scale(.97); }

    .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty h3 { font-family: 'Cormorant', serif; font-style: italic;
      font-size: 1.7rem; margin-bottom: 8px; color: var(--sv3); }

    .loading { grid-column: 1/-1; display: flex; align-items: center;
      justify-content: center; gap: 10px; padding: 40px; color: var(--muted); }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--b1);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fc { position: fixed; bottom: 24px; left: 20px; z-index: 1000;
      background: linear-gradient(135deg, #2ed573, var(--wa), #1eb854);
      color: #fff; text-decoration: none; padding: 13px 20px;
      border-radius: 999px; font-weight: 600;
      font-size: 13px; display: flex; align-items: center; gap: 8px;
      min-height: 48px; box-shadow: 0 5px 24px rgba(37,211,102,.3);
      transition: transform var(--t1) var(--sp);
      border: none;
      cursor: pointer;
    }
    .fc:hover { transform: translateY(-3px); }
    @media (max-width: 480px) { .fc span { display: none; }
      .fc { width: 52px; height: 52px; padding: 0;
        border-radius: 50%; justify-content: center; } }

    #btt { position: fixed; bottom: 24px; right: 20px; z-index: 1000;
      background: rgba(255,255,255,.06); border: 1px solid var(--b2);
      color: var(--sv3); width: 46px; height: 46px; border-radius: 50%;
      cursor: pointer; font-size: 16px; display: none;
      align-items: center; justify-content: center;
      transition: background var(--t1), transform var(--t1); }
    #btt:hover { background: rgba(255,255,255,.12); transform: translateY(-3px); }

    footer { position: relative; z-index: 2;
      background: linear-gradient(180deg, transparent, rgba(6,17,42,.5));
      border-top: 1px solid var(--b1); padding: 40px 20px 28px;
      text-align: center; }
    .f-brand { font-family: 'Cormorant', serif; font-style: italic;
      font-weight: 700; font-size: 1.8rem; color: var(--sv3);
      margin-bottom: 7px; }
    .f-copy { font-size: 11.5px; font-weight: 300; letter-spacing: .1em; color: var(--muted); }

    @media (max-width: 480px) {
      header { padding: 10px 12px; min-height: 52px; }
      .search-bar { padding: 8px 12px; top: 52px; }
      .c-body { padding: 8px 10px 12px; gap: 8px; }
    }
  </style>
</head>
<body>

<div id="prog"></div>

<header>
  <button class="back-btn" onclick="goBack()">‹</button>
  <h1 id="pageTitle">Products</h1>
</header>

<div class="search-bar">
  <div class="s-wrap">
    <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search products…" oninput="handleSearch()">
  </div>
</div>

<main>
  <div class="s-head" id="sh1"><h2 id="sectionTitle">Products</h2><div class="s-div"></div></div>
  <div class="grid" id="aGrid">
    <div class="loading">
      <div class="spinner"></div>
      <span>Loading products…</span>
    </div>
  </div>
</main>

<footer>
  <div class="f-brand">Swoosh Premium</div>
  <p class="f-copy">&copy; 2026 All Rights Reserved</p>
</footer>

<a href="https://wa.me/8801575619905?text=Hi!%20I'm%20interested%20in%20your%20products." class="fc" target="_blank" rel="noopener">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
  <span>Order</span>
</a>
<button id="btt" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

<script type="module">
'use strict';

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDWBiKKfOQHAhYW5DGVeC3e58IaI3Ltm9E",
  authDomain: "swoosh-database.firebaseapp.com",
  projectId: "swoosh-database",
  storageBucket: "swoosh-database.firebasestorage.app",
  messagingSenderId: "911580207883",
  appId: "1:911580207883:web:be3353bb762a38066c600e",
  measurementId: "G-6FV9QQF6LR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WA = '8801575619905';
let allProducts = [];
let cS = '';

// Get category from URL
const params = new URLSearchParams(window.location.search);
const categoryId = params.get('cat') || 'all';

document.getElementById('pageTitle').textContent = decodeURIComponent(params.get('title') || 'Products');
document.getElementById('sectionTitle').textContent = decodeURIComponent(params.get('title') || 'Products');

// SCROLL PROGRESS
const prog = document.getElementById('prog');
const btt = document.getElementById('btt');
let ticking = false;

function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = document.body.scrollHeight - innerHeight;
    prog.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
    btt.style.display = scrollY > 500 ? 'flex' : 'none';
    ticking = false;
  });
}

window.addEventListener('scroll', onScroll, { passive: true });

// LOAD PRODUCTS FROM FIREBASE
const q = categoryId === 'all' ? collection(db, 'products') : query(collection(db, 'products'), where('category', '==', categoryId));

onSnapshot(q, (snapshot) => {
  allProducts = snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  render();
});

// SEARCH
window.handleSearch = function() {
  cS = document.getElementById('searchInput').value.toLowerCase().trim();
  render();
}

// RENDER
function render() {
  let list = [...allProducts];
  if (cS) {
    list = list.filter(p => p.name.toLowerCase().includes(cS));
  }

  const grid = document.getElementById('aGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><h3>No products found</h3></div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  grid.innerHTML = '';

  list.forEach(p => {
    const w = encodeURIComponent(`Hi! I'm interested in "${p.name}" (${p.price}). Can you help?`);
    const photoURL = p.photos?.[0] || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"%3E%3Crect fill="%230A1830" width="400" height="400"/%3E%3C/svg%3E';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="c-img">
        <img src="${photoURL}" class="main-img" alt="${p.name}" loading="lazy">
      </div>
      <div class="c-body">
        <div class="c-top">
          <div class="c-name">${p.name}</div>
          <div class="c-price">${p.price}</div>
        </div>
        <a href="https://wa.me/${WA}?text=${w}" target="_blank" rel="noopener" class="wa">📲 Order</a>
      </div>`;
    frag.appendChild(card);
  });

  grid.appendChild(frag);
  observe();

  // Show section header if hidden
  const sh1 = document.getElementById('sh1');
  if (sh1) sh1.classList.add('vis');
}

// INTERSECTION OBSERVER
let obs;
function observe() {
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('vis');
        obs.unobserve(en.target);
      }
    });
  }, { threshold: 0.06 });

  document.querySelectorAll('.card').forEach(c => obs.observe(c));
}

// NAVIGATION
window.goBack = function() { history.back(); }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F5F7">
  <title>Swoosh Premium — Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
  
  <style>
    :root {
      --bg: #F5F5F7;
      --card-bg: #FFFFFF;
      --txt: #111111;
      --muted: #666666;
      --accent: #0D0D0D;
      --border: rgba(0, 0, 0, 0.08);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #prog {
      position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 9999;
      background: var(--accent);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.1s linear;
    }

    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(245, 245, 247, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: center;
      min-height: 72px;
    }

    .back-btn {
      position: absolute; left: 20px;
      background: transparent; border: none; color: var(--txt);
      font-size: 26px; font-weight: 300; cursor: pointer; padding: 8px;
      transition: opacity 0.3s var(--ease);
    }
    .back-btn:hover { opacity: 0.5; }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem); 
      font-weight: 600; 
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
    }

    .search-bar {
      position: relative; z-index: 199;
      padding: 30px 20px 10px;
      max-width: 1480px; margin: 0 auto;
    }

    .s-wrap { position: relative; width: 100%; max-width: 550px; margin: 0 auto; }
    
    .s-ico { 
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; opacity: 0.4; pointer-events: none; 
    }

    #searchInput {
      width: 100%; padding: 12px 12px 12px 30px; 
      border: none; border-bottom: 1px solid rgba(0,0,0,0.2);
      background: transparent; border-radius: 0;
      font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--txt);
      font-weight: 400; letter-spacing: 0.05em; outline: none; 
      transition: border-color 0.3s var(--ease);
    }
    #searchInput::placeholder { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; }
    #searchInput:focus { border-color: var(--accent); }

    main { max-width: 1480px; margin: 0 auto; padding: 0 20px 120px; position: relative; z-index: 2; }

    .s-head { 
      display: flex; align-items: center; justify-content: space-between;
      margin: 40px 0 30px; opacity: 0; transform: translateY(10px);
      transition: all 0.6s var(--ease); border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }
    .s-head.vis { opacity: 1; transform: none; }
    
    .s-head h2 { 
      font-family: 'Cormorant Garamond', serif; font-weight: 600; font-style: italic;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem); color: var(--txt); 
    }
    
    .s-count-badge {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted);
    }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 35px 16px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 45px 24px; } }
    @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 55px 30px; } }

    /* ELEGANT EUROPEAN CARD */
    .card {
      background: var(--card-bg); 
      display: flex; flex-direction: column;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      opacity: 0; transform: translate3d(0, 20px, 0);
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease), box-shadow 0.4s var(--ease);
      will-change: transform, opacity;
    }
    .card.vis { opacity: 1; transform: none; }
    .card:hover { box-shadow: 0 12px 35px rgba(0,0,0,0.08); }

    .c-img { 
      position: relative; aspect-ratio: 3/4; overflow: hidden; cursor: pointer; 
      background: #EAEAEA;
    }
    
    .main-img { 
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0; transition: opacity 0.4s var(--ease), transform 0.8s var(--ease); 
      -webkit-user-drag: none; pointer-events: none;
    }
    .main-img.on { opacity: 1; }
    .c-img:hover .main-img.on { transform: scale(1.06); }

    /* WATERMARK OVERLAY */
    .watermark-overlay {
      position: absolute; inset: 0; z-index: 4;
      pointer-events: none; user-select: none;
      display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr);
      align-items: center; justify-items: center;
      opacity: 0.28; transform: rotate(-25deg) scale(1.15);
    }
    .wm-text {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px;
      letter-spacing: 0.2em; color: #FFFFFF; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      white-space: nowrap; text-transform: uppercase;
    }

    .c-count { 
      position: absolute; top: 12px; right: 12px; z-index: 5;
      background: rgba(13, 13, 13, 0.7); backdrop-filter: blur(4px);
      color: #FFF; font-size: 10px; font-weight: 500;
      padding: 3px 8px; border-radius: 2px; letter-spacing: 0.1em; 
    }
    
    .c-dots { 
      position: absolute; bottom: 12px; left: 0; right: 0; z-index: 5;
      display: flex; justify-content: center; gap: 5px; 
    }
    .c-dot { 
      width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5);
      cursor: pointer; transition: all 0.3s var(--ease); 
    }
    .c-dot.on { background: #FFF; width: 14px; border-radius: 3px; }
    
    .c-nav { 
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
      background: rgba(255,255,255,0.85); color: #000; border: none; width: 32px; height: 32px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; font-size: 16px; font-weight: 400;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: all 0.3s var(--ease); 
    }
    .c-img:hover .c-nav { opacity: 1; }
    .c-nav:hover { background: #FFF; transform: translateY(-50%) scale(1.1); }
    .c-prev { left: 10px; } .c-next { right: 10px; }
    @media (hover: none) { .c-nav { display: none; } }

    /* PRODUCT DETAILS SECTION */
    .c-body { 
      padding: 18px 16px 20px; 
      display: flex; flex-direction: column; flex: 1; 
      background: #FFFFFF; border-top: 1px solid var(--border);
    }
    
    .c-tag {
      font-size: 9.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.18em; color: #888888; margin-bottom: 6px;
    }

    .c-name { 
      font-family: 'Cormorant Garamond', serif; font-weight: 600;
      font-size: clamp(1.1rem, 2vw, 1.25rem); color: var(--txt);
      line-height: 1.25; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
    }
    
    .c-details-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-top: 8px; border-top: 1px stroke var(--border);
    }

    .c-price { 
      font-family: 'Outfit', sans-serif; font-weight: 700; 
      font-size: clamp(14px, 2vw, 16px); color: var(--txt);
      letter-spacing: 0.02em; 
    }

    .c-status {
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em;
      padding: 3px 8px; background: #F0F0F0; color: #444; border-radius: 2px;
    }

    .wa {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #FFF; text-decoration: none; border-radius: 3px;
      padding: 12px 16px; font-family: 'Outfit', sans-serif;
      font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: all 0.3s var(--ease); margin-top: auto; border: 1px solid var(--accent);
      cursor: pointer;
    }
    .wa svg { width: 14px; height: 14px; fill: currentColor; }
    .wa:hover { background: #FFFFFF; color: var(--accent); }
    .wa:active { transform: scale(0.98); }

    /* LIGHTBOX */
    .lightbox { 
      position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity 0.3s var(--ease), visibility 0.3s; 
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lb-img { max-width: 92vw; max-height: 85vh; object-fit: contain; }
    
    .lb-close { 
      position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
      background: transparent; border: none; color: #FFF; font-size: 32px; font-weight: 200; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; 
    }
    .lb-close:hover { opacity: 0.6; }
    
    .lb-nav { 
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 50px; height: 80px; background: transparent; border: none;
      color: #FFF; font-size: 36px; font-weight: 200; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; 
    }
    .lb-nav:hover { opacity: 0.6; }
    .lb-prev { left: 10px; } .lb-next { right: 10px; }
    
    .lb-counter { 
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 0.2em; font-weight: 400; 
    }

    .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty h3 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 2rem; font-weight: 600; color: var(--txt); }

    .loading { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 80px 20px; color: var(--muted); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fc { 
      position: fixed; bottom: 25px; left: 25px; z-index: 1000;
      background: #25D366; color: #FFF; text-decoration: none; padding: 0 22px;
      border-radius: 50px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      font-size: 11px; display: flex; align-items: center; gap: 10px;
      height: 50px; box-shadow: 0 8px 25px rgba(37,211,102,0.3);
      transition: all 0.3s var(--ease); cursor: pointer; border: none;
    }
    .fc svg { width: 18px; height: 18px; fill: currentColor; }
    .fc:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(37,211,102,0.4); }
    
    @media (max-width: 600px) { 
      .fc span { display: none; }
      .fc { width: 48px; height: 48px; padding: 0; justify-content: center; left: 16px; bottom: 16px; }
    }

    #btt { 
      position: fixed; bottom: 25px; right: 25px; z-index: 1000;
      background: #FFFFFF; border: 1px solid var(--border);
      color: var(--txt); width: 48px; height: 48px; border-radius: 50%;
      cursor: pointer; font-size: 18px; display: none;
      align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      transition: all 0.3s var(--ease); 
    }
    #btt:hover { background: var(--accent); color: #FFF; }
    @media (max-width: 600px) { #btt { bottom: 16px; right: 16px; } }

    footer { 
      position: relative; z-index: 2;
      background: #FFFFFF; border-top: 1px solid var(--border); padding: 50px 20px 35px;
      text-align: center; 
    }
    .f-brand { 
      font-family: 'Cormorant Garamond', serif; font-weight: 600; text-transform: uppercase;
      font-size: 1.6rem; letter-spacing: 0.15em; color: var(--txt);
      margin-bottom: 10px; 
    }
    .f-copy { font-size: 10px; font-weight: 500; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }

    @media (max-width: 480px) {
      header { min-height: 60px; padding: 0 16px; }
      .search-bar { padding: 15px 16px 5px; }
      .c-body { padding: 14px 12px 16px; }
      .grid { gap: 20px 12px; }
    }
  </style>
</head>
<body>

<div id="prog"></div>

<header>
  <button class="back-btn" onclick="goBack()">‹</button>
  <h1 id="pageTitle">Products</h1>
</header>

<div class="search-bar">
  <div class="s-wrap">
    <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search collection..." oninput="handleSearch()">
  </div>
</div>

<main>
  <div class="s-head" id="sh1">
    <h2 id="sectionTitle">Collection</h2>
    <span class="s-count-badge" id="itemCount">SWOOSH BD</span>
  </div>
  <div class="grid" id="aGrid">
    <div class="loading">
      <div class="spinner"></div>
      <span>Loading Collection…</span>
    </div>
  </div>
</main>

<footer>
  <div class="f-brand">SWOOSH BD</div>
  <p class="f-copy">&copy; 2026 All Rights Reserved</p>
</footer>

<a href="https://wa.me/8801575619905?text=Hi!%20I'm%20interested%20in%20your%20products." class="fc" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
  <span>Direct Order</span>
</a>
<button id="btt" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

<script type="module">
'use strict';

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDWBiKKfOQHAhYW5DGVeC3e58IaI3Ltm9E",
  authDomain: "swoosh-database.firebaseapp.com",
  projectId: "swoosh-database",
  storageBucket: "swoosh-database.firebasestorage.app",
  messagingSenderId: "911580207883",
  appId: "1:911580207883:web:be3353bb762a38066c600e",
  measurementId: "G-6FV9QQF6LR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WA = '8801575619905';

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let allProducts = [];
let cS = '';

const params = new URLSearchParams(window.location.search);
const categoryId = params.get('cat') || 'all';

document.getElementById('pageTitle').textContent = decodeURIComponent(params.get('title') || 'Products');
document.getElementById('sectionTitle').textContent = decodeURIComponent(params.get('title') || 'Collection');

const prog = document.getElementById('prog');
const btt = document.getElementById('btt');
let ticking = false;

function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = document.body.scrollHeight - innerHeight;
    prog.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
    btt.style.display = scrollY > 400 ? 'flex' : 'none';
    ticking = false;
  });
}

window.addEventListener('scroll', onScroll, { passive: true });

const q = categoryId === 'all' ? collection(db, 'products') : query(collection(db, 'products'), where('category', '==', categoryId));

onSnapshot(q, (snapshot) => {
  allProducts = snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  render();
});

window.handleSearch = function() {
  cS = document.getElementById('searchInput').value.toLowerCase().trim();
  render();
}

function render() {
  let list = [...allProducts];
  if (cS) {
    list = list.filter(p => p.name.toLowerCase().includes(cS));
  }

  const grid = document.getElementById('aGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><h3>No items found</h3></div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  grid.innerHTML = '';

  list.forEach(p => {
    const w = encodeURIComponent(`Hi SWOOSH BD! I want to order "${p.name}" (${p.price}).`);
    const photos = (Array.isArray(p.photos) && p.photos.length) ? p.photos : ['data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"%3E%3Crect fill="%23EAEAEA" width="300" height="400"/%3E%3C/svg%3E'];
    const multi = photos.length > 1;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="c-img" data-idx="0" data-photos="${esc(JSON.stringify(photos))}">
        <!-- Watermark Grid Layer -->
        <div class="watermark-overlay">
          <span class="wm-text">SWOOSH BD</span><span class="wm-text">SWOOSH BD</span>
          <span class="wm-text">SWOOSH BD</span><span class="wm-text">SWOOSH BD</span>
          <span class="wm-text">SWOOSH BD</span><span class="wm-text">SWOOSH BD</span>
        </div>
        ${photos.map((url, i) => `<img src="${esc(url)}" class="main-img${i === 0 ? ' on' : ''}" alt="${esc(p.name)}" loading="lazy" oncontextmenu="return false;">`).join('')}
        ${multi ? `<div class="c-count">1/${photos.length}</div><button type="button" class="c-nav c-prev" aria-label="Previous photo">‹</button><button type="button" class="c-nav c-next" aria-label="Next photo">›</button><div class="c-dots">${photos.map((_, i) => `<span class="c-dot${i === 0 ? ' on' : ''}" data-i="${i}"></span>`).join('')}</div>` : ''}
      </div>
      <div class="c-body">
        <div class="c-tag">SWOOSH EXCLUSIVE</div>
        <h3 class="c-name">${esc(p.name)}</h3>
        <div class="c-details-row">
          <span class="c-price">${esc(p.price)}</span>
          <span class="c-status">AVAILABLE</span>
        </div>
        <a href="https://wa.me/${WA}?text=${w}" target="_blank" rel="noopener" class="wa">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>

    frag.appendChild(card);
  });

  grid.appendChild(frag);
  observe();

  const sh1 = document.getElementById('sh1');
  if (sh1) sh1.classList.add('vis');
}

let obs;
function observe() {
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('vis');
        obs.unobserve(en.target);
      }
    });
  }, { threshold: 0.05 });

  document.querySelectorAll('.card').forEach(c => obs.observe(c));
}

function setActivePhoto(cImg, idx) {
  const imgs = cImg.querySelectorAll('.main-img');
  const total = imgs.length;
  if (!total) return;
  idx = ((idx % total) + total) % total;
  imgs.forEach((img, i) => img.classList.toggle('on', i === idx));
  cImg.querySelectorAll('.c-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
  const countEl = cImg.querySelector('.c-count');
  if (countEl) countEl.textContent = `${idx + 1}/${total}`;
  cImg.dataset.idx = idx;
}

const galleryGrid = document.getElementById('aGrid');

galleryGrid.addEventListener('click', (e) => {
  if (gallerySwiped) { gallerySwiped = false; return; }
  const cImg = e.target.closest('.c-img');
  if (!cImg) return;
  const nav = e.target.closest('.c-nav');
  const dot = e.target.closest('.c-dot');
  if (nav || dot) {
    e.preventDefault();
    let idx = Number(cImg.dataset.idx || 0);
    if (dot) idx = Number(dot.dataset.i);
    else if (nav.classList.contains('c-prev')) idx -= 1;
    else idx += 1;
    setActivePhoto(cImg, idx);
    return;
  }
  let photosArr = [];
  try { photosArr = JSON.parse(cImg.dataset.photos || '[]'); } catch (err) { photosArr = []; }
  if (photosArr.length) openLightbox(photosArr, Number(cImg.dataset.idx || 0));
});

let galleryTouchX = null;
galleryGrid.addEventListener('touchstart', (e) => {
  const cImg = e.target.closest('.c-img');
  galleryTouchX = cImg ? e.touches[0].clientX : null;
}, { passive: true });

let gallerySwiped = false;
galleryGrid.addEventListener('touchend', (e) => {
  const cImg = e.target.closest('.c-img');
  if (!cImg || galleryTouchX === null) return;
  const dx = e.changedTouches[0].clientX - galleryTouchX;
  if (Math.abs(dx) > 40) {
    setActivePhoto(cImg, Number(cImg.dataset.idx || 0) + (dx < 0 ? 1 : -1));
    gallerySwiped = true;
  }
  galleryTouchX = null;
}, { passive: true });

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCounter = document.getElementById('lbCounter');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbClose = document.getElementById('lbClose');
let lbPhotos = [];
let lbIndex = 0;

function openLightbox(photosArr, index) {
  lbPhotos = photosArr;
  lbIndex = index;
  renderLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function renderLightbox() {
  lbImg.src = lbPhotos[lbIndex];
  const multi = lbPhotos.length > 1;
  lbCounter.textContent = `${lbIndex + 1} / ${lbPhotos.length}`;
  lbCounter.style.display = multi ? 'block' : 'none';
  lbPrev.style.display = multi ? 'flex' : 'none';
  lbNext.style.display = multi ? 'flex' : 'none';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lbPrev.addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; renderLightbox(); });
lbNext.addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbPhotos.length; renderLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbPrev.click();
  if (e.key === 'ArrowRight') lbNext.click();
});
let lbTouchX = null;
lightbox.addEventListener('touchstart', (e) => { lbTouchX = e.touches[0].clientX; }, { passive: true });
lightbox.addEventListener('touchend', (e) => {
  if (lbTouchX === null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  if (Math.abs(dx) > 40) (dx < 0 ? lbNext : lbPrev).click();
  lbTouchX = null;
}, { passive: true });

window.goBack = function() { history.back(); }
</script>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close" type="button">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo" type="button">‹</button>
  <img class="lb-img" id="lbImg" src="" alt="" oncontextmenu="return false;">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo" type="button">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

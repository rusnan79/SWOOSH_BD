<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swoosh | Men's Premium Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Jost', sans-serif; background-color: #ffffff; color: #111; overflow-x: hidden; }
        h1, h2, h3, h4, h5 { font-family: 'Cinzel', serif; font-weight: 400; }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 5%; 
            background: linear-gradient(135deg, #0a0a0c 0%, #1e1e24 50%, #000000 100%);
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .brand-logo { 
            height: 38px; 
            object-fit: contain; 
            filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(255,255,255,0.2)); 
        }

        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a {
            text-decoration: none; color: #ffffff;
            font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
            transition: color 0.3s ease; cursor: pointer;
        }
        .nav-links a:hover { color: #d4af37; }
        .cart-icon { border-bottom: 1px solid #ffffff; padding-bottom: 2px; font-weight: 500; }

        /* Hero Section */
        .men-hero {
            height: 75vh;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?q=80&w=1920&auto=format&fit=crop") center 20%/cover no-repeat;
            display: flex; align-items: center; justify-content: center; text-align: center; position: relative;
        }
        
        .hero-text { position: relative; z-index: 1; color: #fff; padding: 0 20px; }
        .hero-text h1 { font-size: 55px; letter-spacing: 8px; margin-bottom: 15px; text-transform: uppercase; text-shadow: 2px 4px 10px rgba(0,0,0,0.6); }
        .hero-text p { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #eaeaea; text-shadow: 1px 2px 5px rgba(0,0,0,0.8); }

        /* Category Grid */
        .category-section { padding: 80px 5%; text-align: center; background: #fff; border-bottom: 1px solid #f5f5f5; }
        .section-header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 40px; }
        .section-title { font-size: 26px; letter-spacing: 4px; text-transform: uppercase; }
        .view-all-btn { cursor: pointer; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #111; padding: 8px 15px; transition: 0.3s; background: transparent; }
        .view-all-btn:hover { background: #111; color: #fff; }

        .category-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 25px; justify-content: center; max-width: 1200px; margin: 0 auto;
        }
        .category-item { cursor: pointer; transition: 0.3s ease; }
        .category-item img {
            width: 100%; height: 260px; object-fit: cover;
            border-radius: 4px; margin-bottom: 15px; transition: transform 0.4s ease, filter 0.3s;
        }
        .category-item:hover img { transform: translateY(-5px); filter: brightness(0.85); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .category-item h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

        /* Product Grid & Slider */
        .featured-products { padding: 70px 5% 100px; max-width: 1400px; margin: 0 auto; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 50px; }
        .product-card { transition: opacity 0.4s ease; }

        .image-box { 
            height: 450px; background: #f9f9f9; margin-bottom: 25px; 
            position: relative; overflow: hidden; border-radius: 4px;
        }
        
        /* Watermark */
        .image-box::after {
            content: 'SWOOSH BD      SWOOSH BD      SWOOSH BD      SWOOSH BD      SWOOSH BD      SWOOSH BD';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            transform: rotate(-30deg);
            font-family: 'Jost', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.22);
            line-height: 6rem;
            letter-spacing: 5px;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            z-index: 5;
            white-space: pre-wrap;
        }

        .slider-container {
            display: flex; width: 100%; height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .slider-container img {
            min-width: 100%; height: 100%; object-fit: cover; cursor: pointer;
            transition: transform 0.5s ease;
        }
        .image-box:hover .slider-container img {
            transform: scale(1.05);
        }

        /* Slider Controls */
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.4); color: #fff; border: none;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; z-index: 6; opacity: 0; transition: opacity 0.3s;
        }
        .image-box:hover .slider-btn { opacity: 1; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        .slider-btn:hover { background: rgba(0,0,0,0.7); }

        .product-details { text-align: center; }
        .brand { font-size: 11px; color: #888; letter-spacing: 3px; text-transform: uppercase; display: block; margin-bottom: 10px;}
        .title { font-size: 16px; font-weight: 500; margin-bottom: 10px; letter-spacing: 1px;}
        .price { font-size: 15px; font-weight: 600; margin-bottom: 20px; display: block;}
        
        /* Buttons */
        .action-btns { display: flex; gap: 12px; justify-content: center; margin-top: 15px; }
        .action-btns button { 
            padding: 14px 15px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; border: 1px solid #111; flex: 1; transition: all 0.3s ease;
        }
        .btn-bag { background: #fff; color: #111; }
        .btn-bag:hover { background: #111; color: #fff; transform: translateY(-3px); }

        .btn-order { background: #111; color: #fff; transition: all 0.3s ease; }
        .btn-order:hover { background: #0047ab; color: #fff; border-color: #0047ab; transform: translateY(-3px); }

        /* Lightbox Modal */
        .lightbox-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .lightbox-modal.active { display: flex; }
        .lightbox-content { max-width: 90%; max-height: 80vh; object-fit: contain; border-radius: 4px; }
        .lightbox-close {
            position: absolute; top: 25px; right: 35px; color: #fff; font-size: 40px; cursor: pointer;
        }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); color: #fff; border: none;
            padding: 15px 20px; font-size: 20px; cursor: pointer; border-radius: 4px;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.4); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* Cart Sidebar Drawer */
        .cart-sidebar { 
            position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; 
            background: #fff; z-index: 1500; box-shadow: -10px 0 40px rgba(0,0,0,0.2); 
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 30px; 
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .close-cart { font-size: 28px; cursor: pointer; color: #888; }
        .close-cart:hover { color: #111; }
        
        .cart-items-body { flex: 1; overflow-y: auto; margin-top: 20px; padding-right: 5px; }

        .footer { text-align: center; padding: 70px 20px; background: #0a0a0c; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="aartboard 1.png" alt="Swoosh Logo" class="brand-logo">
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="womens-categories.html">Women's</a>
            <a onclick="toggleCart()" class="cart-icon" id="cart-counter">Bag (0)</a>
        </div>
    </nav>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div>
            <div class="cart-header">
                <h3>Your Bag</h3>
                <span class="close-cart" onclick="toggleCart()">&times;</span>
            </div>
            <div class="cart-items-body" id="cartItemsList">
                <p style="color: #888; text-align: center; margin-top: 40px;">Your bag is empty.</p>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</button>
        <img class="lightbox-content" id="lightboxImg" src="">
        <button class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">&#10095;</button>
    </div>

    <!-- Hero Section -->
    <header class="men-hero">
        <div class="hero-text">
            <h1>Men's Exclusives</h1>
            <p>The Premium Curated Edit</p>
        </div>
    </header>

    <section class="category-section">
        <div class="section-header">
            <h2 class="section-title">Shop The Collection</h2>
            <button class="view-all-btn" onclick="filterCategory('all')">View All</button>
        </div>
        <div class="category-grid">
            <div class="category-item" onclick="filterCategory('sneakers')">
                <img src="/photos/Air Jordan 1 Retro Low OG “Chicago”.jpg" alt="Sneakers">
                <h3>Sneakers</h3>
            </div>
            <div class="category-item" onclick="filterCategory('slides')">
                <img src="/photos/slide.jpg" alt="Slides">
                <h3>Slides</h3>
            </div>
            <div class="category-item" onclick="filterCategory('shirts')">
                <img src="/photos/download.jpg" alt="Shirts">
                <h3>Formal shirts & Pants</h3>
            </div>
            <div class="category-item" onclick="filterCategory('joggers')">
                <img src="/photos/Gucci Gucci Long Pants 0925 Gucci M-3XL 11tn04.jpg" alt="Joggers">
                <h3>Joggers & Trousers</h3>
            </div>
            <div class="category-item" onclick="filterCategory('tshirts')">
                <img src="/photos/Men's Summer Fashionable Short-sleeve T-shirt.jpg" alt="T-Shirts">
                <h3>Dropshoulder T-shirts</h3>
            </div>
            <div class="category-item" onclick="filterCategory('watches')">
                <img src="/photos/watch.jpg" alt="Watches">
                <h3>Watches</h3>
            </div>
        </div>
    </section>

    <section class="featured-products">
        <div class="product-grid" id="productGrid">
            <!-- Dynamic products will render here from LocalStorage/Admin -->
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 Swoosh BD — Men's Premium Store.</p>
    </footer>

    <script>
        const whatsappNumber = "8801575619904"; 
        let cart = [];

        // Initial default products for Men's section
        const defaultMensProducts = [
            {
                id: "m1",
                title: "Air Jordan 1 Mid Blush",
                brand: "SNEAKERS",
                category: "sneakers",
                price: 14500,
                images: [
                    "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                id: "m2",
                title: "Classic Leather Tote",
                brand: "BAGS",
                category: "bags",
                price: 8200,
                images: [
                    "https://images.unsplash.com/photo-1584916201218-f4242ceb4809?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1591561954557-26941169b49e?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                id: "m3",
                title: "Stiletto Pointed Heels",
                brand: "HEELS & SANDALS",
                category: "heels",
                price: 4800,
                images: [
                    "https://images.unsplash.com/photo-1562183241-b937e95585b6?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?q=80&w=600&auto=format&fit=crop"
                ]
            }
        ];

        // Fetch Men's products from localStorage or set defaults
        function getMensProducts() {
            const stored = localStorage.getItem('mensProducts');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    console.error("Error parsing mensProducts from localStorage", e);
                }
            }
            // Save defaults if empty
            localStorage.setItem('mensProducts', JSON.stringify(defaultMensProducts));
            return defaultMensProducts;
        }

        let activeCategory = 'all';

        // Render Products Dynamically
        function renderProducts(category = 'all') {
            activeCategory = category;
            const grid = document.getElementById('productGrid');
            const products = getMensProducts();

            const filtered = (category === 'all') 
                ? products 
                : products.filter(p => (p.category || '').toLowerCase().trim() === category.toLowerCase().trim());

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 50px 0; font-size: 14px; letter-spacing: 1px;">No products available in this category.</p>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const imgList = (p.images && p.images.length > 0) ? p.images : [p.image || 'https://via.placeholder.com/600'];
                const hasSlider = imgList.length > 1;

                const sliderImagesHtml = imgList.map(img => 
                    `<img src="${img}" onclick="openLightbox(this)" alt="${p.title}">`
                ).join('');

                return `
                <div class="product-card" data-category="${p.category || ''}">
                    <div class="image-box">
                        ${hasSlider ? `<button class="slider-btn prev-btn" onclick="slideImage(this, -1)">&#10094;</button>` : ''}
                        <div class="slider-container" data-index="0">
                            ${sliderImagesHtml}
                        </div>
                        ${hasSlider ? `<button class="slider-btn next-btn" onclick="slideImage(this, 1)">&#10095;</button>` : ''}
                    </div>
                    <div class="product-details">
                        <span class="brand">${(p.brand || p.category || 'SWOOSH').toUpperCase()}</span>
                        <h4 class="title">${p.title}</h4>
                        <span class="price">৳ ${Number(p.price).toLocaleString()}</span>
                        <div class="action-btns">
                            <button class="btn-bag" onclick="addToCart('${p.title.replace(/'/g, "\\'")}', ${p.price}, this)">Add to Bag</button>
                            <button class="btn-order" onclick="directOrder('${p.title.replace(/'/g, "\\'")}', ${p.price})">Order Now</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterCategory(categoryName) {
            document.querySelector('.featured-products').scrollIntoView({ behavior: 'smooth' });
            renderProducts(categoryName);
        }

        // Auto-update UI if Admin updates localStorage from another tab
        window.addEventListener('storage', (e) => {
            if (e.key === 'mensProducts') {
                renderProducts(activeCategory);
            }
        });

        // Initialize Products on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts('all');
        });

        /* Cart Functions */
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addToCart(title, price, btn) {
            cart.push({ title, price });
            updateCartUI();
            
            btn.innerText = "Added ✓";
            btn.style.background = "#28a745"; 
            btn.style.color = "#fff";
            btn.style.borderColor = "#28a745";

            setTimeout(() => { 
                btn.innerText = "Add to Bag"; 
                btn.style.background = "#fff"; 
                btn.style.color = "#111"; 
                btn.style.borderColor = "#111";
            }, 1000);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = `Bag (${cart.length})`;
            const listContainer = document.getElementById('cartItemsList');

            if (cart.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; text-align: center; margin-top: 40px;">Your bag is empty.</p>';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f0f0f0;">
                        <div>
                            <h5 style="font-size: 14px; font-weight: 500; margin-bottom: 4px;">${item.title}</h5>
                            <span style="font-size: 13px; font-weight: 600; color: #111;">৳ ${item.price.toLocaleString()}</span>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background: none; border: none; color: #ff4d4d; font-size: 20px; cursor: pointer; padding: 0 5px;">&times;</button>
                    </div>
                `;
            });

            html += `
                <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #111;">
                    <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 16px; margin-bottom: 25px;">
                        <span>TOTAL AMOUNT:</span>
                        <span>৳ ${total.toLocaleString()}</span>
                    </div>
                    <button onclick="proceedToCheckout(${total})" style="width: 100%; padding: 16px; background: #111; color: #fff; border: 1px solid #111; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease; font-weight: 500;" onmouseover="this.style.background='#0047ab'; this.style.borderColor='#0047ab';" onmouseout="this.style.background='#111'; this.style.borderColor='#111';">Proceed to Order</button>
                </div>
            `;

            listContainer.innerHTML = html;
        }

        function proceedToCheckout(total) {
            if (cart.length === 0) return;
            let message = "Hello Swoosh BD, I want to order the following items from my Bag:\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.title} - ৳${item.price.toLocaleString()}\n`;
            });
            message += `\n*Total Amount: ৳${total.toLocaleString()}*\n\nPlease confirm my order.`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function directOrder(title, price) {
            let message = `Hello Swoosh BD, I want to order this product:\n\n*Product:* ${title}\n*Price:* ৳${price.toLocaleString()}\n\nPlease confirm my order.`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        /* Slider Controls */
        function slideImage(btn, direction) {
            const imageBox = btn.closest('.image-box');
            const container = imageBox.querySelector('.slider-container');
            const images = container.querySelectorAll('img');
            let currentIndex = parseInt(container.getAttribute('data-index'));

            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;

            container.setAttribute('data-index', currentIndex);
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        /* Lightbox Functions */
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        function openLightbox(imgElement) {
            const container = imgElement.closest('.slider-container');
            currentLightboxImages = Array.from(container.querySelectorAll('img')).map(img => img.src);
            currentLightboxIndex = currentLightboxImages.indexOf(imgElement.src);

            const modal = document.getElementById('lightboxModal');
            const modalImg = document.getElementById('lightboxImg');
            modalImg.src = currentLightboxImages[currentLightboxIndex];
            modal.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        function changeLightboxImage(direction) {
            currentLightboxIndex += direction;
            if (currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
            if (currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;
            document.getElementById('lightboxImg').src = currentLightboxImages[currentLightboxIndex];
        }
    </script>
</body>
</html>
